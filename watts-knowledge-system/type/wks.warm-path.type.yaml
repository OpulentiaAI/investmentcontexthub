#: A public, evidenced route through a person to a target.
#: Extends idea: the route is a proposed introduction, not a claimed relationship.
extends: [idea::au-base-types, wks.managed]
fields:
  #: The person or organization we could be introduced to.
  target: wks.person* | wks.org*
  #: The person who could make the introduction.
  introducer: wks.person*
  #: How the public record connects the introducer to the target.
  pathKind: [shared-network, former-colleagues, investor, advisor, customer, partner, community]
  #: Required. Without a public URL, this route cannot be used.
  evidenceUrl: String
  #: Required. A URL without its observation date cannot establish a current route.
  observedAt: Date
  #: Relationship proximity as supported by the cited public record.
  strength: [cold, distant, affiliated, working, direct]
  #: no keeps the route visible for research but blocks its use.
  verified: [yes, no]
